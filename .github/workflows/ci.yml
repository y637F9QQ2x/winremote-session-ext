name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # One command per step: the default shell here is pwsh, and a pwsh step
      # fails only when its last command fails.
      # constraints.txt pins every package, pytest and ruff included, to the
      # versions the tests ran with.
      - name: Install upstream
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Install the extension, pytest and ruff
        run: python -m pip install . pytest ruff -c constraints.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        run: python -m pytest
